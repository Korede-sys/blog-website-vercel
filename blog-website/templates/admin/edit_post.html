{% extends "base.html" %}

{% block title %}Edit Post - Admin{% endblock %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto;">
    <div class="admin-header">
        <h1>✏️ Edit Post</h1>
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">← Back to Dashboard</a>
    </div>

    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="title">Title *</label>
            <input type="text" id="title" name="title" value="{{ post.title }}" required maxlength="200">
        </div>

        <div class="form-group">
            <label for="excerpt">Excerpt</label>
            <textarea id="excerpt" name="excerpt" rows="3" maxlength="500">{{ post.excerpt }}</textarea>
        </div>

        <div class="form-group">
            <label for="content">Content *</label>
            <textarea id="content" name="content" rows="15" required>{{ post.content }}</textarea>
        </div>

        <div class="form-group">
            <label for="featured_image">Featured Image</label>
            {% if post.featured_image %}
            <div style="margin-bottom: 1rem;">
                <img src="{{ url_for('static', filename='uploads/' + post.featured_image) }}" 
                     style="max-width: 300px; border-radius: 8px;">
                <p><small>Current image. Upload new to replace.</small></p>
            </div>
            {% endif %}
            <input type="file" id="featured_image" name="featured_image" accept="image/*" onchange="previewImage(this)">
            <img id="image-preview" style="display: none; max-width: 300px; margin-top: 1rem; border-radius: 8px;">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category">
                    <option value="General" {% if post.category == 'General' %}selected{% endif %}>General</option>
                    <option value="Technology" {% if post.category == 'Technology' %}selected{% endif %}>Technology</option>
                    <option value="Lifestyle" {% if post.category == 'Lifestyle' %}selected{% endif %}>Lifestyle</option>
                    <option value="Travel" {% if post.category == 'Travel' %}selected{% endif %}>Travel</option>
                    <option value="Food" {% if post.category == 'Food' %}selected{% endif %}>Food</option>
                    <option value="Health" {% if post.category == 'Health' %}selected{% endif %}>Health</option>
                    <option value="Business" {% if post.category == 'Business' %}selected{% endif %}>Business</option>
                    <option value="Entertainment" {% if post.category == 'Entertainment' %}selected{% endif %}>Entertainment</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tags">Tags</label>
                <input type="text" id="tags" name="tags" value="{{ post.tags }}" placeholder="e.g., python, web-dev, tutorial">
            </div>
        </div>

        <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status">
                <option value="draft" {% if post.status == 'draft' %}selected{% endif %}>Draft (Save for later)</option>
                <option value="published" {% if post.status == 'published' %}selected{% endif %}>Published (Make live)</option>
            </select>
        </div>

        <div style="display: flex; gap: 1rem;">
            <button type="submit" class="btn btn-primary">💾 Update Post</button>
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
